name: Release AppImage

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    env:
      APP_ID: facekey
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-tools-dev qt6-tools-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtmultimedia \
            qml6-module-qtqml-workerscript qml6-module-qtquick-templates \
            qml6-module-qtquick-window qml6-module-qtqml-models \
            patchelf xvfb \
            librsvg2-bin file wget desktop-file-utils

      - name: Locate qmake6
        run: |
          QMAKE="$(command -v qmake6 || ls /usr/lib/qt6/bin/qmake 2>/dev/null || ls /usr/lib/x86_64-linux-gnu/qt6/bin/qmake 2>/dev/null || true)"
          echo "qmake: $QMAKE"
          test -n "$QMAKE"
          echo "$(dirname "$QMAKE")" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Fetch linuxdeploy
        run: |
          wget -q -O linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-version 2>&1 | head -n 2 || true

      - name: Bundle AppDir
        run: |
          export QML_SOURCES_PATHS="$PWD/qml"
          # Ship the Wayland platform plugins too: sessions that force
          # QT_QPA_PLATFORM=wayland (e.g. Hyprland) abort at startup when
          # only xcb is bundled. NOTE: this must be EXTRA_PLATFORM_PLUGINS
          # (bare .so names); EXTRA_QT_PLUGINS is deprecated and ignores
          # platforms/ paths.
          export EXTRA_PLATFORM_PLUGINS="libqwayland-egl.so;libqwayland-generic.so"
          # The FFmpeg camera backend is not auto-detected (nothing links it
          # directly); without it Camera creation aborts the app.
          export EXTRA_QT_MODULES="multimedia"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e "target/release/${APP_ID}" \
            -d "Packaging/${APP_ID}.desktop" \
            -i "Packaging/${APP_ID}.svg" \
            --plugin qt
          ls AppDir/usr/plugins/platforms/ | head -n 20

      - name: Deploy Wayland integration plugins
        # The Qt plugin ships the wayland *platform* plugins but not the
        # client integrations Qt needs for EGL contexts on Wayland. Without
        # them there is no GL context, RHI fails, and the app aborts.
        # Missing lib deps are chased via ldd (only Qt/Wayland/ffi libs —
        # never system libc-class libs) and rpath-fixed like siblings.
        run: |
          QTP="$(qmake6 -query QT_INSTALL_PLUGINS)"
          echo "Qt plugins dir: $QTP"
          for d in wayland-graphics-integration-client wayland-decoration-client wayland-shell-integration; do
            mkdir -p "AppDir/usr/plugins/$d"
            cp -L "$QTP/$d/"*.so "AppDir/usr/plugins/$d/"
          done
          mkdir -p AppDir/usr/lib
          for so in AppDir/usr/plugins/wayland-*/lib*.so; do
            for dep in $(ldd "$so" | grep "=> /" | awk '{print $3}'); do
              base="$(basename "$dep")"
              case "$base" in
                libQt6Wayland*|libwayland*|libffi.so.*)
                  if [ ! -e "AppDir/usr/lib/$base" ]; then
                    echo "bundling dep: $base"
                    cp -L "$dep" AppDir/usr/lib/
                  fi
                  ;;
              esac
            done
          done
          for f in AppDir/usr/plugins/wayland-*/lib*.so AppDir/usr/lib/libQt6Wayland* AppDir/usr/lib/libwayland* AppDir/usr/lib/libffi.so.*; do
            [ -e "$f" ] || continue
            patchelf --set-rpath '$ORIGIN/../../lib:$ORIGIN' "$f" 2>/dev/null || patchelf --set-rpath '$ORIGIN' "$f"
          done
          echo "--- unresolved deps (must be empty) ---"
          LD_LIBRARY_PATH="$PWD/AppDir/usr/lib" ldd AppDir/usr/plugins/wayland-*/lib*.so 2>/dev/null | grep "not found" && exit 1 || true
          echo "wayland integration OK"

      - name: Produce AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          ls -l ./*.AppImage

      - name: Verify bundled Qt payload
        run: |
          # Fail loudly instead of shipping a broken bundle: the Wayland
          # platform plugins and the QML imports must actually be present.
          test -f AppDir/usr/plugins/platforms/libqwayland-generic.so
          test -f AppDir/usr/plugins/platforms/libqwayland-egl.so
          test -d AppDir/usr/qml/QtQuick
          test -d AppDir/usr/qml/QtQuick/Controls
          test -d AppDir/usr/qml/QtQuick/Templates
          test -d AppDir/usr/qml/QtQuick/Window
          test -d AppDir/usr/qml/QtQml/WorkerScript
          test -d AppDir/usr/qml/QtQml/Models
          test -n "$(ls AppDir/usr/plugins/multimedia/*.so 2>/dev/null)"
          test -n "$(ls AppDir/usr/plugins/wayland-graphics-integration-client/*.so 2>/dev/null)"
          echo "Qt payload OK"

      - name: Rename AppImage
        run: |
          SRC="$(ls -t ./*.AppImage | head -n 1)"
          DST="${APP_ID}-${GITHUB_REF_NAME}-x86_64.AppImage"
          mv "$SRC" "$DST"
          echo "APPIMAGE=$DST" >> "$GITHUB_ENV"
          ls -l "$DST"

      - name: Boot the AppImage (fail on any load error)
        run: |
          # Start the real bundle headless. Startup needs no interaction
          # (no Howdy on the runner, so no auth prompts can appear).
          # The app must STAY ALIVE with a clean log: an engine that fails
          # to load quits within seconds, which we treat as failure.
          xvfb-run -a ./${APPIMAGE} > appimage-smoke.log 2>&1 & APP=$!
          sleep 12
          if ! kill -0 $APP 2>/dev/null; then
            echo "SMOKE FAILED: AppImage exited early"
            cat appimage-smoke.log
            exit 1
          fi
          sleep 15
          kill $APP 2>/dev/null || true
          sleep 2
          cat appimage-smoke.log
          if grep -qiE "failed to load component|module .* is not installed|could not (load|find) the Qt|cannot load library" appimage-smoke.log; then
            echo "SMOKE FAILED: AppImage does not start cleanly"
            exit 1
          fi
          echo "SMOKE OK"

      - name: Attach to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: ${{ env.APPIMAGE }}
