name: Release AppImage

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    env:
      APP_ID: facekey
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-tools-dev qt6-tools-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtmultimedia \
            qml6-module-qtqml-workerscript qml6-module-qtquick-templates \
            xvfb \
            librsvg2-bin file wget desktop-file-utils

      - name: Locate qmake6
        run: |
          QMAKE="$(command -v qmake6 || ls /usr/lib/qt6/bin/qmake 2>/dev/null || ls /usr/lib/x86_64-linux-gnu/qt6/bin/qmake 2>/dev/null || true)"
          echo "qmake: $QMAKE"
          test -n "$QMAKE"
          echo "$(dirname "$QMAKE")" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Fetch linuxdeploy
        run: |
          wget -q -O linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-version 2>&1 | head -n 2 || true

      - name: Bundle AppDir
        run: |
          export QML_SOURCES_PATHS="$PWD/qml"
          # Ship the Wayland platform plugins too: sessions that force
          # QT_QPA_PLATFORM=wayland (e.g. Hyprland) abort at startup when
          # only xcb is bundled. NOTE: this must be EXTRA_PLATFORM_PLUGINS
          # (bare .so names); EXTRA_QT_PLUGINS is deprecated and ignores
          # platforms/ paths.
          export EXTRA_PLATFORM_PLUGINS="libqwayland-egl.so;libqwayland-generic.so"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e "target/release/${APP_ID}" \
            -d "Packaging/${APP_ID}.desktop" \
            -i "Packaging/${APP_ID}.svg" \
            --plugin qt \
            --output appimage
          ls -l ./*.AppImage

      - name: Verify bundled Qt payload
        run: |
          # Fail loudly instead of shipping a broken bundle: the Wayland
          # platform plugins and the QML imports must actually be present.
          test -f AppDir/usr/plugins/platforms/libqwayland-generic.so
          test -f AppDir/usr/plugins/platforms/libqwayland-egl.so
          test -d AppDir/usr/qml/QtQuick
          test -d AppDir/usr/qml/QtQuick/Controls
          test -d AppDir/usr/qml/QtQuick/Templates
          test -d AppDir/usr/qml/QtQml/WorkerScript
          echo "Qt payload OK"

      - name: Boot the AppImage (fail on any load error)
        run: |
          # No more shipping blind: start the real bundle headless and
          # abort the release if the engine cannot load. Startup needs no
          # interaction (no Howdy on the runner, so no auth prompts).
          xvfb-run -a ./${APPIMAGE} > appimage-smoke.log 2>&1 & APP=$!
          for i in $(seq 1 30); do
            sleep 1
            grep -qiE "failed to load component|is not installed|could not load|could not find|plugin.*not found" appimage-smoke.log && break
          done
          sleep 5
          kill $APP 2>/dev/null || true
          cat appimage-smoke.log
          if grep -qiE "failed to load component|is not installed|could not load the Qt|could not find the Qt|plugin .* not found" appimage-smoke.log; then
            echo "SMOKE FAILED: AppImage does not start cleanly"
            exit 1
          fi
          echo "SMOKE OK"

      - name: Rename AppImage
        run: |
          SRC="$(ls -t ./*.AppImage | head -n 1)"
          DST="${APP_ID}-${GITHUB_REF_NAME}-x86_64.AppImage"
          mv "$SRC" "$DST"
          echo "APPIMAGE=$DST" >> "$GITHUB_ENV"
          ls -l "$DST"

      - name: Attach to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: ${{ env.APPIMAGE }}
