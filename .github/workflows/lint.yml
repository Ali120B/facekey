name: Lint

on:
  push:
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust toolchain with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Enforce formatting (problems.md finding 10)
        run: cargo fmt --check
